name: Bug 反馈
description: 报告一个问题（算错了、界面不对、崩溃等）
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请把下面几项填全，尤其是**版本号**和**复现步骤**，这样我能最快定位。

  - type: input
    id: version
    attributes:
      label: HashTool 版本
      description: 窗口标题栏上的版本号，或右键 exe → 属性 → 详细信息 里的文件版本
      placeholder: v1.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows 版本
      description: 例如 Windows 11 23H2 / Windows 10 22H2
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望的结果 vs 实际的结果
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好（选了什么样的文件、点了哪个按钮、有没有用 F5 刷新等）
      placeholder: |
        1. 拖入一个 3 GB 的文件夹
        2. 点「刷新 (F5)」
        3. 期望只重算改过的文件，实际全部重算了
    validations:
      required: true

  - type: dropdown
    id: algo
    attributes:
      label: 用的是哪个算法
      options:
        - MD5 + SHA-256（默认）
        - 仅 MD5
        - 仅 SHA-256
        - 和算法无关
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其它信息（可选）
      description: 截图、导出的 JSON 片段（**注意去掉敏感路径**）等
    validations:
      required: false
