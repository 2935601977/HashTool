name: 功能建议
description: 想要一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 说说使用场景，比直接说"加个 XX 按钮"更有用
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么做
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 请确认（本项目的两条硬约束）
      options:
        - label: 我理解这个项目**只用 Windows 自带的东西**，不引入第三方库 / 运行时
          required: true
        - label: 我理解源码要保持 **C# 5 语法**（兼容系统自带的 csc.exe）
          required: true
